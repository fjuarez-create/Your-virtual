name: Deploy al hosting (FTP)

# Publica el showroom en el hosting propio (showroom.unikdi.com) en cada push
# a la rama de trabajo. Requiere estos secretos en GitHub → Settings → Secrets
# and variables → Actions → New repository secret:
#   FTP_SERVER      host FTP del panel, p. ej. lin127.loading.es
#   FTP_USERNAME    usuario FTP
#   FTP_PASSWORD    contraseña FTP
#   FTP_SERVER_DIR  (opcional) carpeta destino. Dejándolo en ./ el propio
#                   script detecta si hay que entrar en httpdocs.
#
# La subida la hace lftp (.github/scripts/ftp-deploy.sh) en lugar de una
# acción prefabricada: la anterior abría el canal de datos con una sesión TLS
# nueva y Plesk lo cortaba (ECONNRESET).

on:
  push:
    branches: [claude/virtual-real-estate-showroom-cnb7kx]
  workflow_dispatch:

# Un push nuevo sustituye al anterior: cada deploy sube el estado completo del
# repositorio, así que el que llega después deja el sitio igual de correcto.
concurrency:
  group: hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # El importmap referencia los módulos con ?v=__BUILD__; al fijarlo al SHA
      # el HTML y el JS se cachean siempre como conjunto consistente.
      - name: Versionar módulos
        run: sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html

      # La clave de Maps es pública por naturaleza (viaja al navegador), pero no
      # entra en el repositorio, que sí lo es. Se sella aquí desde el secreto.
      # Sin secreto, el marcador se queda y el entorno real no se activa.
      - name: Sellar la clave de Maps
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -eu
          if [ -n "${MAPS_API_KEY:-}" ]; then
            MAPS_API_KEY="$MAPS_API_KEY" perl -pi -e 's/__MAPS_KEY__/$ENV{MAPS_API_KEY}/g' index.html
            echo "Clave sellada; el entorno real queda disponible."
          else
            echo "Sin secreto MAPS_API_KEY: el entorno real queda desactivado."
          fi

      - name: Preparar carpeta de publicación
        run: |
          set -eu
          rm -rf publish && mkdir publish
          cp index.html publish/
          cp -r assets css data js vendor publish/
          du -sh publish

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Tres pasos en vez de uno para que el log señale dónde falla si falla.
      - name: Subir assets
        timeout-minutes: 30
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: bash .github/scripts/ftp-deploy.sh assets

      - name: Subir código
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: bash .github/scripts/ftp-deploy.sh code

      - name: Subir index.html
        timeout-minutes: 5
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: bash .github/scripts/ftp-deploy.sh index

      # Cuenta lo que ha quedado en el servidor y falla si falta algo, para que
      # un deploy incompleto no pase por bueno.
      - name: Comprobar la subida
        timeout-minutes: 10
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          bash .github/scripts/ftp-deploy.sh check
          echo "Publicado en https://showroom.unikdi.com/"

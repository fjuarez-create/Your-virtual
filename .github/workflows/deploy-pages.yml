name: Deploy showroom (GitHub Pages)

# Publica el sitio en la rama gh-pages (fuente de GitHub Pages).
# Se usa esta vía porque el GITHUB_TOKEN no puede crear el sitio de
# Pages mediante la API (actions/configure-pages falla con
# "Resource not accessible by integration").

on:
  push:
    branches: [claude/virtual-real-estate-showroom-cnb7kx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar en gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf --cached . >/dev/null
          rm -rf .github
          touch .nojekyll
          # Versionado de módulos: el importmap referencia js/*.js con
          # ?v=__BUILD__; al fijarlo al SHA, HTML y JS cachean en versiones
          # consistentes (evita mezclas tras cada deploy).
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" index.html
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f origin gh-pages

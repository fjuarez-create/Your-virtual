name: Deploy UNIK repasos (FTP)

# Publica la app de repasos en su subdominio (p. ej. repasos.unikdi.com)
# en cada push que toque la carpeta repasos/. Es independiente del
# despliegue del showroom: cada uno va a su propio sitio.
#
# Secretos necesarios (GitHub → Settings → Secrets and variables →
# Actions → New repository secret):
#   FTP_REPASOS_SERVER      host FTP, p. ej. lin127.loading.es
#   FTP_REPASOS_USERNAME    usuario FTP del subdominio
#   FTP_REPASOS_PASSWORD    contraseña
#   FTP_REPASOS_SERVER_DIR  (opcional) carpeta destino; vacío = se detecta
#
# config.php y las carpetas api/uploads y api/datos viven solo en el
# servidor: el despliegue no los sube ni los borra.

on:
  push:
    branches: [claude/uniq-repasos-app-2ja8y2]
    paths:
      - 'repasos/**'
      - '.github/workflows/deploy-repasos.yml'
      - '.github/scripts/ftp-repasos.sh'
  workflow_dispatch:

concurrency:
  group: hosting-repasos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # El SHA del commit sella la versión en index.html y en sw.js. Al
      # cambiar, el service worker tira su caché entera y no quedan
      # mezclas de una versión con otra.
      - name: Sellar la versión
        run: |
          set -eu
          BUILD="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/${BUILD}/g" repasos/index.html repasos/sw.js
          echo "Versión: ${BUILD}"

      - name: Preparar carpeta de publicación
        run: |
          set -eu
          rm -rf publish && mkdir publish
          cp repasos/index.html repasos/sw.js repasos/manifest.webmanifest repasos/.htaccess publish/
          cp -r repasos/css repasos/js repasos/assets publish/

          # El backend, sin el ejemplo de configuración ni los datos.
          mkdir -p publish/api
          cp -r repasos/api/. publish/api/
          rm -rf publish/api/uploads publish/api/datos
          rm -f publish/api/config.php publish/api/config.example.php

          # tools/ solo sirve para regenerar iconos en local.
          du -sh publish
          find publish -type f | wc -l

      - name: Comprobar que no viaja ningún secreto
        run: |
          set -eu
          if [ -f publish/api/config.php ]; then
            echo "config.php no debe subirse nunca." >&2
            exit 1
          fi
          if grep -rIl --exclude-dir=assets -E "password'\s*=>\s*'[^']+'" publish/api 2>/dev/null | grep -q .; then
            echo "Hay credenciales en los ficheros a publicar." >&2
            exit 1
          fi
          echo "Sin credenciales en la carpeta de publicación."

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir código y backend
        timeout-minutes: 12
        env:
          FTP_REPASOS_SERVER: ${{ secrets.FTP_REPASOS_SERVER }}
          FTP_REPASOS_USERNAME: ${{ secrets.FTP_REPASOS_USERNAME }}
          FTP_REPASOS_PASSWORD: ${{ secrets.FTP_REPASOS_PASSWORD }}
          FTP_REPASOS_SERVER_DIR: ${{ secrets.FTP_REPASOS_SERVER_DIR }}
        run: bash .github/scripts/ftp-repasos.sh subir

      - name: Subir index.html y sw.js
        timeout-minutes: 5
        env:
          FTP_REPASOS_SERVER: ${{ secrets.FTP_REPASOS_SERVER }}
          FTP_REPASOS_USERNAME: ${{ secrets.FTP_REPASOS_USERNAME }}
          FTP_REPASOS_PASSWORD: ${{ secrets.FTP_REPASOS_PASSWORD }}
          FTP_REPASOS_SERVER_DIR: ${{ secrets.FTP_REPASOS_SERVER_DIR }}
        run: bash .github/scripts/ftp-repasos.sh arranque

      - name: Comprobar la subida
        timeout-minutes: 6
        env:
          FTP_REPASOS_SERVER: ${{ secrets.FTP_REPASOS_SERVER }}
          FTP_REPASOS_USERNAME: ${{ secrets.FTP_REPASOS_USERNAME }}
          FTP_REPASOS_PASSWORD: ${{ secrets.FTP_REPASOS_PASSWORD }}
          FTP_REPASOS_SERVER_DIR: ${{ secrets.FTP_REPASOS_SERVER_DIR }}
        run: bash .github/scripts/ftp-repasos.sh comprobar

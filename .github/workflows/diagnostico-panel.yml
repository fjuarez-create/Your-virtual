name: Diagnóstico del panel

# Desde el entorno donde se desarrolla no hay salida a showroom.unikdi.com, así
# que las comprobaciones contra el hosting se hacen aquí: el runner sí llega al
# dominio y además tiene los secretos de FTP. Se lanza a mano.
#
#   mirar        solo lee: pide cada URL, lista lo que hay en el servidor y
#                descarga la última parte del log de errores.
#   sin-htaccess renombra gestion/.htaccess y vuelve a pedir la página, para
#                saber si el 500 lo provoca ese fichero (algunos hostings no
#                permiten DirectoryIndex en un .htaccess y responden 500).
#   restaurar    deshace lo anterior.

on:
  # GitHub no acepta lanzar por API un workflow que no esté en la rama
  # principal, así que además se dispara al tocar sus propios ficheros: para
  # repetir el diagnóstico basta con volver a subir este script.
  push:
    branches:
      - claude/hopeful-faraday-7y80bt
    paths:
      - .github/workflows/diagnostico-panel.yml
      - .github/scripts/ftp-diagnostico.sh
  workflow_dispatch:
    inputs:
      accion:
        description: Qué hacer
        type: choice
        default: mirar
        options: [mirar, sin-htaccess, restaurar]

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # El discriminante importante: comprobar.php no carga lib.php. Si esa
      # contesta y index.php no, el problema está en lib.php. Si no contesta
      # ninguna, es del servidor (PHP apagado, .htaccess, permisos).
      - name: Pedir cada URL
        run: |
          set -u
          for ruta in / /gestion/ /gestion/index.php /gestion/comprobar.php \
                      /gestion/api/estado.php /gestion/estilo.css \
                      /gestion/datos/estado.json /gestion/datos/clave.php \
                      /data/availability.json; do
            printf '\n────────── %s\n' "$ruta"
            curl -sS -o /tmp/cuerpo -D /tmp/cab -m 25 \
              "https://showroom.unikdi.com${ruta}" || echo "  (curl falló)"
            head -1 /tmp/cab 2>/dev/null || true
            grep -iE '^(content-type|content-length|server|x-powered-by|location)' /tmp/cab 2>/dev/null || true
            echo "  ── primeros 400 bytes del cuerpo:"
            head -c 400 /tmp/cuerpo 2>/dev/null | sed 's/^/  /'
            echo
          done

      # Veredicto de una línea: lo que de verdad hay que saber es si las tres
      # páginas contestan y si el panel enseña el formulario de la contraseña.
      - name: Veredicto
        run: |
          set -u
          fallos=0
          for ruta in /gestion/ /gestion/index.php /gestion/comprobar.php /gestion/api/estado.php; do
            c=$(curl -sS -o /dev/null -w '%{http_code}' -m 25 "https://showroom.unikdi.com${ruta}" || echo 000)
            if [ "$c" = 200 ]; then echo "  ok   $ruta"; else echo "  MAL  $ruta → $c"; fallos=$((fallos+1)); fi
          done
          if curl -sS -m 25 https://showroom.unikdi.com/gestion/ | grep -q 'accion" value="crear"'; then
            echo "  ok   el panel pide crear la contraseña (todavía sin crear)"
          elif curl -sS -m 25 https://showroom.unikdi.com/gestion/ | grep -q 'accion" value="entrar"'; then
            echo "  ok   el panel pide la contraseña (ya está creada)"
          else
            echo "  MAL  el panel no enseña ni el formulario de crear ni el de entrar"; fallos=$((fallos+1))
          fi
          n=$(curl -sS -m 25 https://showroom.unikdi.com/gestion/api/estado.php | grep -o '"total": *[0-9]*' || true)
          echo "  endpoint: ${n:-sin respuesta}"
          [ "$fallos" = 0 ] && echo "TODO CORRECTO" || { echo "QUEDAN $fallos FALLOS" >&2; exit 1; }

      # comprobar.php es la única página del panel que contesta, y dentro lleva
      # la versión de PHP del dominio. Es el dato que decide qué sintaxis puede
      # usar el resto del código.
      - name: Leer la comprobación entera
        run: |
          set -u
          curl -sS -m 25 https://showroom.unikdi.com/gestion/comprobar.php \
            | sed -e 's/<[^>]*>/ /g' -e 's/  */ /g' | grep -v '^ *$' | sed 's/^/  /'

      - name: Mirar el servidor por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          ACCION: ${{ inputs.accion }}
        run: bash .github/scripts/ftp-diagnostico.sh

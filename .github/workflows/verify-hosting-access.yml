name: Verify hosting access (temporary probe)

on:
  push:
    branches: [codex/verify-hosting-access-20261103]
    paths: [.github/workflows/verify-hosting-access.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify FTP login, temporary write, read and cleanup
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'PY'
          import os, ssl, ftplib, io, uuid, urllib.parse, urllib.request
          required = ("FTP_SERVER", "FTP_USERNAME", "FTP_PASSWORD")
          if any(not os.environ.get(k) for k in required):
              raise SystemExit("RESULT: missing configured FTP secret")
          server = os.environ["FTP_SERVER"].strip()
          parsed = urllib.parse.urlsplit(server if "://" in server else "//" + server)
          host, port = parsed.hostname, parsed.port or 21
          if not host or parsed.scheme not in ("", "ftp", "ftps"):
              raise SystemExit("RESULT: unsupported server format")
          directory = os.environ.get("FTP_SERVER_DIR", "").strip()
          probe_dir = "codex-access-check-" + uuid.uuid4().hex
          probe_name = "verification.txt"
          payload = ("Temporary hosting access verification " + uuid.uuid4().hex + "\n").encode()
          ftp = ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=25)
          created_dir = False
          attempted_file = False
          verified = False
          cleaned = False
          stage = "TLS connection"
          try:
              ftp.connect(host, port)
              ftp.auth()
              stage = "login"
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              print("PASS: authenticated FTP access over TLS")
              # Match the established hosting configuration for benign test data.
              ftp.prot_c()
              if directory and directory not in (".", "./"):
                  ftp.cwd(directory)
              else:
                  names = [n.rstrip("/").split("/")[-1] for n in ftp.nlst()]
                  if "httpdocs" in names:
                      ftp.cwd("httpdocs")
              stage = "create temporary directory"
              ftp.mkd(probe_dir)
              created_dir = True
              ftp.cwd(probe_dir)
              stage = "write temporary file"
              attempted_file = True
              ftp.storbinary("STOR " + probe_name, io.BytesIO(payload))
              print("PASS: created a new folder and uploaded test content")
              stage = "read back temporary file"
              received = io.BytesIO()
              ftp.retrbinary("RETR " + probe_name, received.write)
              if received.getvalue() != payload:
                  raise ValueError("content mismatch")
              verified = True
              print("PASS: downloaded content matches uploaded content")
              try:
                  url = "https://showroom.unikdi.com/" + probe_dir + "/" + probe_name
                  with urllib.request.urlopen(url, timeout=20) as response:
                      served = response.read(4096)
                  print("PASS: content served by showroom.unikdi.com" if served == payload else "INFO: HTTP content not confirmed")
              except Exception:
                  print("INFO: HTTP serving not confirmed; FTP write and read verified")
          except Exception as exc:
              print("FAIL: " + stage + " (" + type(exc).__name__ + ")")
          finally:
              if created_dir:
                  try:
                      if attempted_file:
                          try:
                              ftp.delete(probe_name)
                          except ftplib.error_perm as exc:
                              if not str(exc).startswith("550"):
                                  raise
                      ftp.cwd("..")
                      ftp.rmd(probe_dir)
                      cleaned = True
                      print("PASS: temporary file and directory removed")
                  except Exception as exc:
                      print("FAIL: cleanup (" + type(exc).__name__ + "); temporary path: " + probe_dir + "/" + probe_name)
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()
          if not (verified and cleaned):
              raise SystemExit(1)
          print("RESULT: current hosting access, upload, read and cleanup verified")
          PY

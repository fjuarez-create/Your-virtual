<div id="app"><canvas id="scene"></canvas></div>

<!-- Línea fina de progreso arriba del todo: carga del edificio primero y,
     después, construcción y convergencia del trazador de rayos. -->
<div id="progreso" aria-hidden="true"><div id="progresoBarra"></div></div>
<div id="cargando" role="status" aria-live="polite"><span class="punto"></span><span id="cargandoTexto">Preparando el edificio…</span></div>

<!-- ═══════════════════ Carcasa ═══════════════════ -->
<nav id="rail" aria-label="Herramientas">
  <div id="brand"><img src="assets/logo_unik.png" alt="UNIK"></div>

  <div class="grupo">
    <button class="rail-btn" id="bConjunto" data-nombre="Conjunto" aria-label="Conjunto">
      <svg><use href="#i-map-trifold"></use></svg>
    </button>
    <button class="rail-btn" id="bEdificio" data-nombre="Edificio" aria-label="Edificio">
      <svg><use href="#i-diamond"></use></svg>
    </button>
    <button class="rail-btn" id="bPlantas" data-nombre="Plantas" aria-label="Plantas">
      <svg><use href="#i-stack-simple"></use></svg>
    </button>
    <button class="rail-btn" id="bPlano" data-nombre="Plano" aria-label="Plano">
      <svg><use href="#i-plan"></use></svg>
    </button>
    <button class="rail-btn" id="bRenders" data-nombre="Renders" aria-label="Renders">
      <svg><use href="#i-image-square"></use></svg>
    </button>
    <button class="rail-btn" id="bVideo" data-nombre="Vídeo" aria-label="Vídeo">
      <svg><use href="#i-play-circle"></use></svg>
    </button>
  </div>

  <div class="grupo">
    <button class="rail-btn" id="bCentrar" data-nombre="Recentrar" aria-label="Recentrar">
      <svg><use href="#i-crosshair-simple"></use></svg>
    </button>
  </div>
</nav>

<!-- La barra de plantas nace a la altura exacta del botón de plantas y se
     despliega en horizontal: 1 · 2 · 3 · 4 · Edificio completo. shell.js le
     fija la cota leyendo la del botón, así siempre quedan alineados. -->
<nav id="plantas" aria-label="Selector de planta">
  <div class="rejilla" id="plantasRejilla">
    <button class="planta-btn" data-planta="baja" title="Planta 1">1</button>
    <button class="planta-btn" data-planta="p1" title="Planta 2">2</button>
    <button class="planta-btn" data-planta="p2" title="Planta 3">3</button>
    <button class="planta-btn" data-planta="atico" title="Planta 4">4</button>
    <button class="planta-btn ancho" data-planta="all" title="Edificio completo">Edificio completo</button>
  </div>
</nav>

<!-- Ficha de la vivienda enfocada: cristal, abajo a la izquierda, junto al
     raíl. Aparece al enfocar y se retira con "Volver a la planta". -->
<aside id="ficha" aria-label="Ficha de vivienda" hidden>
  <header>
    <span class="ficha-id" id="fichaId">—</span>
    <span class="ficha-estado" id="fichaEstado">Disponible</span>
  </header>
  <p class="ficha-tipo" id="fichaTipo"></p>
  <dl class="ficha-datos">
    <div><dt>Vivienda</dt><dd id="fichaSupViv"></dd></div>
    <div><dt>Terraza</dt><dd id="fichaTerraza"></dd></div>
    <div><dt>Total</dt><dd id="fichaSupTotal"></dd></div>
    <div><dt>Orientación</dt><dd id="fichaOrient"></dd></div>
  </dl>
  <p class="ficha-precio" id="fichaPrecio"></p>
  <button id="fichaVolver" class="ficha-volver"><svg><use href="#i-back"></use></svg>Volver a la planta</button>
</aside>

<!-- Marca de la comercializadora, abajo a la derecha. Si el fichero no está
     todavía, la caja desaparece sin dejar un icono roto. -->
<div id="marcaGilmar"><img src="assets/logo_gilmar.png" alt="Gilmar" onerror="this.parentNode.hidden=true"></div>

<div id="horas">
  <button class="hora-btn" id="horaPrincipal" aria-label="Momento del día">
    <svg><use href="#i-sun"></use></svg>
  </button>
  <button class="hora-btn opcion" data-momento="amanecer" data-nombre="Amanecer">
    <svg><use href="#i-cloud-sun"></use></svg>
  </button>
  <button class="hora-btn opcion" data-momento="dia" data-nombre="Mediodía">
    <svg><use href="#i-sun"></use></svg>
  </button>
  <button class="hora-btn opcion" data-momento="atardecer" data-nombre="Atardecer">
    <svg><use href="#i-sun-horizon"></use></svg>
  </button>
  <button class="hora-btn opcion" data-momento="noche" data-nombre="Noche">
    <svg><use href="#i-moon"></use></svg>
  </button>
</div>

<section class="capa" id="capaRenders" aria-label="Renders">
  <button class="capa-cerrar" data-cierra="capaRenders" aria-label="Cerrar"><svg><use href="#i-x"></use></svg></button>
  <div class="marco">
    <img id="renderGrande" alt="">
    <div class="tiras" id="renderTiras"></div>
    <p class="pie" id="renderPie"></p>
  </div>
</section>

<section class="capa" id="capaVideo" aria-label="Vídeo">
  <button class="capa-cerrar" data-cierra="capaVideo" aria-label="Cerrar"><svg><use href="#i-x"></use></svg></button>
  <div class="marco">
    <video id="videoProm" controls playsinline preload="none"></video>
    <p class="pie" id="videoPie"></p>
  </div>
</section>

<script type="module">import 'app/visor/main.js'; import 'app/shell.js';</script>
</body>
</html>
